[project]
name = "weather-aware-truck-routing-api"
version = "1.0.0"
description = "Django API that plans truck routes and scores them against forecast weather risk."
requires-python = ">=3.12"
# Runtime dependencies. requirements.txt mirrors this list for Docker/pip;
# tests/test_dependencies.py keeps the two in sync.
dependencies = [
    "Django==5.1.4",
    "djangorestframework==3.15.2",
    "django-cors-headers==4.6.0",
    "drf-spectacular==0.28.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "dj-database-url==2.3.0",
    "psycopg[binary]==3.2.3",
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "freezegun==1.5.1",
    "ruff==0.8.4",
    "django-stubs[compatible-mypy]==5.1.1",
    "djangorestframework-stubs[compatible-mypy]==3.15.2",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
# Runs on Vercel after dependencies are installed (collectstatic runs automatically).
build = "python scripts/vercel_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PL"]
ignore = ["PLR2004", "PLR0913", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations", ".venv"]

[[tool.mypy.overrides]]
module = ["dj_database_url", "respx", "freezegun"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:apps.*",
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]
