# Render Blueprint: deploys the Django API as a Docker web service.
# Create the Neon Postgres database separately and paste its connection string
# into DATABASE_URL in the Render dashboard (it is marked sync: false below).
services:
  - type: web
    name: weather-truck-routing-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    autoDeploy: true
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\\.vercel\\.app$"
